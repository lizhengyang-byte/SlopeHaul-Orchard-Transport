name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ezdxf matplotlib pytest
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Rebuild benchmark + figures + demo
        run: |
          python -m scripts.run_benchmark
          python -m scripts.make_figures
          python -m scripts.make_prototype_layout
          python -m scripts.run_planner_demo
          python -m scripts.train_soil_classifier
      - name: Build drawings (DXF/PDF/PNG)
        run: |
          python -m cad.build_drawings
          python -m cad.build_electrical
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slopehaul-generated
          path: |
            cad/out/*.dxf
            cad/out/*.pdf
            cad/out/*.png
            cad/out/*.csv
            figures/*.svg
            results/*.json
            results/*.csv
            results/*.md
            models/*.json
