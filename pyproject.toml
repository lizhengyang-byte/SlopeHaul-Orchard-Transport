[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "slopehaul"
version = "0.1.0"
description = "AI terrain perception and adaptive control for heavy-load transport on mountain orchard slopes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Li Shangru", email = "3035326878@qq.com"}]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["slopehaul*"]
